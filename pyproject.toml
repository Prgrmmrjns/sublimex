[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sublimex"
version = "0.1.0"
description = "SublimeX: Supervised Bottom-Up Localized Multi-Representative Feature eXtraction for time series and spatial data"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "J.C. Wolber", email = "jwolber@ukaachen.de"}
]
maintainers = [
    {name = "J.C. Wolber", email = "jwolber@ukaachen.de"}
]
keywords = [
    "time series",
    "feature extraction",
    "machine learning",
    "interpretable ml",
    "signal processing",
    "classification",
    "regression",
    "bayesian optimization"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "optuna>=3.0.0",
    "lightgbm>=3.3.0",
]

[project.optional-dependencies]
visualization = [
    "matplotlib>=3.5.0",
]
full = [
    "matplotlib>=3.5.0",
    "pandas>=1.3.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "matplotlib>=3.5.0",
    "pandas>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/Prgrmmrjns/SublimeX"
Documentation = "https://github.com/Prgrmmrjns/SublimeX#readme"
Repository = "https://github.com/Prgrmmrjns/SublimeX.git"
Issues = "https://github.com/Prgrmmrjns/SublimeX/issues"

[tool.setuptools]
packages = ["sublimex"]
package-dir = {"" = "."}

[tool.setuptools.package-data]
sublimex = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sublimex"
version = "0.1.2"
description = "SublimeX: Supervised Bottom-Up Localized Multi-Representative Feature eXtraction for time series and spatial data"
readme = "README.md"
license = "MIT"
authors = [
    {name = "J.C. Wolber", email = "jwolber@ukaachen.de"}
]
maintainers = [
    {name = "J.C. Wolber", email = "jwolber@ukaachen.de"}
]
keywords = [
    "time series",
    "feature extraction",
    "machine learning",
    "interpretable ml",
    "signal processing",
    "classification",
    "regression",
    "bayesian optimization"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "optuna",
    "lightgbm",
]

[project.optional-dependencies]
visualization = [
    "matplotlib",
]

[project.urls]
Homepage = "https://github.com/Prgrmmrjns/SublimeX"
Documentation = "https://github.com/Prgrmmrjns/SublimeX#readme"
Repository = "https://github.com/Prgrmmrjns/SublimeX.git"

[tool.setuptools]
packages = ["sublimex"]
package-dir = {"" = "."}

[tool.setuptools.package-data]
sublimex = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py311', 'py312', 'py313']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
